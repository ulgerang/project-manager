[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-manager-workspace"
version = "0.1.0"
description = "Self-hosted project status service, dashboard and agent CLI"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]
desktop = ["pywebview>=5,<6"]

[project.scripts]
pmw = "pmw.cli:main"
pmw-server = "pmw.server:main"
pmw-widget = "pmw.widget:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pmw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
